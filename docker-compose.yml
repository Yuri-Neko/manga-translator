name: manga-translator
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ./.cloudflare:/etc/cloudflared:ro
    depends_on:
      web:
        condition: service_started
    networks: [frontend]
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-manga}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-manga}
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-40}
    volumes: [manga_data:/data]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [frontend, backend]
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-manga}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-manga}
      REDIS_URL: redis://redis:6379
      LIBRETRANSLATE_URL: http://translate:5000
      DATA_DIR: /data
      OCR_MAX_IMAGE_SIDE: ${OCR_MAX_IMAGE_SIDE:-2200}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-libretranslate}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-2.5-flash}
      OCR_PROVIDER: ${OCR_PROVIDER:-paddle}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-http://host.docker.internal:1234/v1}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-local}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-local-model}
      DIFFUSION_INPAINT_URL: ${DIFFUSION_INPAINT_URL:-}
      DIFFUSION_DENOISING_STRENGTH: ${DIFFUSION_DENOISING_STRENGTH:-0.35}
      DIFFUSION_STEPS: ${DIFFUSION_STEPS:-12}
      DIFFUSION_TIMEOUT: ${DIFFUSION_TIMEOUT:-240}
    volumes:
      - manga_data:/data
      - paddle_models:/root/.paddleocr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      translate:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-6G}
    networks: [backend]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manga}
      POSTGRES_USER: ${POSTGRES_USER:-manga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manga} -d ${POSTGRES_DB:-manga}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]
  translate:
    image: libretranslate/libretranslate:v1.6.3
    restart: unless-stopped
    environment:
      LT_DISABLE_WEB_UI: "true"
      LT_LOAD_ONLY: "ja,id,en,ko,zh,es,fr,de,pt,ru"
    command: ["--host", "0.0.0.0", "--port", "5000", "--disable-web-ui"]
    volumes: [translate_models:/home/libretranslate/.local]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/languages', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks: [backend]
volumes:
  manga_data:
  postgres_data:
  redis_data:
  paddle_models:
  translate_models:
networks:
  frontend: {}
  backend: {}
